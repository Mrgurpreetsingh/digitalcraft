version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: digitalcraft_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: digitalcraft
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - digitalcraft_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalcraft_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=app_user
      - DB_PASSWORD=app_password
      - DB_NAME=digitalcraft
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - digitalcraft_network

  apache:
    image: httpd:2.4
    container_name: digitalcraft_apache
    ports:
      - "8080:80"
    volumes:
      - ./apache/html:/usr/local/apache2/htdocs/
    restart: unless-stopped
    networks:
      - digitalcraft_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: digitalcraft_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: app_user
      PMA_PASSWORD: app_password
    ports:
      - "8081:80"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - digitalcraft_network

volumes:
  mysql_data:

networks:
  digitalcraft_network:
    driver: bridge