[build]
  # Répertoire de build
  publish = "dist"
  
  # Commande de build
  command = "npm run build"

[build.environment]
  # Version de Node.js
  NODE_VERSION = "18"

# Redirections pour SPA React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Compression gzip pour améliorer les performances
[[headers]]
  for = "*.js"
  [headers.values]
    Content-Encoding = "gzip"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Encoding = "gzip"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirections pour le SEO
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Gestion des erreurs 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Variables d'environnement (à configurer dans l'interface Netlify)
[context.production.environment]
  VITE_API_URL = "https://votre-backend-production.com"

[context.deploy-preview.environment]
  VITE_API_URL = "https://votre-backend-staging.com"

[context.branch-deploy.environment]
  VITE_API_URL = "https://votre-backend-dev.com" 